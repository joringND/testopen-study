[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py *_test.py day*_homework.py
addopts = -v
markers =
    smoke: 冒烟用例，验证核心链路
    full: 全量回归用例
log_cli=true
log_cli_level=INFO
log_file=logs/run.log
log_file_level=INFO
log_format=%(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format=%Y-%m-%d %H:%M:%S